name: Manual NPM Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version to release (e.g., 1.3.0)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
#          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Determine and bump version safely
      - name: Determine release version
        id: version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION=${{ github.event.inputs.version }}
            npm version $NEW_VERSION --no-git-tag-version -m "chore(release): bump version to %s"
          else
            NEW_VERSION=$(npm version patch -m "chore(release): bump version to %s")
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Only commit and push if package.json/package-lock.json changed
          if ! git diff --quiet package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to $NEW_VERSION"
            git pull origin development --rebase
            git push origin development
          else
            echo "No version changes to commit, skipping push."
          fi

      # 5️⃣ Generate release notes from merged PRs
      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Normalize repo URL from package.json
          REPO_URL=$(node -p "require('./package.json').repository.url")
          if [[ "$REPO_URL" == git://* ]]; then
            REPO_URL=${REPO_URL#git://}
            REPO_URL=${REPO_URL%.git}
            REPO_URL="https://$REPO_URL"
          else
            REPO_URL=${REPO_URL#git@github.com:}
            REPO_URL=${REPO_URL#https://github.com/}
            REPO_URL=${REPO_URL%.git}
            REPO_URL="https://github.com/$REPO_URL"
          fi
          
          # Get last tag (or empty if none)
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tags found. Using all commits."
            LAST_COMMIT=""
          else
            LAST_COMMIT=$(git rev-list -n 1 $LAST_TAG)
          fi
          
          # Fetch merged PRs since last tag
          PRS=$(gh pr list --repo $REPO_URL \
                --state merged \
                --base development \
                --json number,title,author,url,mergedAt \
                --limit 100)
          
          # Filter PRs merged after last tag commit (if any)
          if [ -n "$LAST_COMMIT" ]; then
            PRS=$(echo "$PRS" | jq --arg LAST "$LAST_COMMIT" '[.[] | select(.mergedAt > $LAST)]')
          fi
          
          # Build release notes
          NOTES="## What's Changed\n"
          
          if [ $(echo "$PRS" | jq 'length') -eq 0 ]; then
            NOTES+="* No merged PRs since last release\n"
          else
            for row in $(echo "$PRS" | jq -r '.[] | @base64'); do
              _jq() {
                echo "$row" | base64 --decode | jq -r "$1"
              }
              TITLE=$(_jq '.title')
              NUMBER=$(_jq '.number')
              USER=$(_jq '.author.login')
              URL=$(_jq '.url')
              NOTES+="* $TITLE by @$USER in $URL\n"
            done
          fi
          
          NOTES+="\n**Full Changelog**: $REPO_URL/compare/$LAST_TAG...${{ env.NEW_VERSION }}\n"
          
          # Export release notes safely to GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          printf "%s" "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 6️⃣ Create GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_VERSION }}
          release_name: ${{ env.NEW_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7️⃣ Build the package
      - name: Build package
        run: npm run build

#      # 8️⃣ Publish to npm
#      - name: Publish to npm
#        run: npm publish --access public
#        env:
#          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
