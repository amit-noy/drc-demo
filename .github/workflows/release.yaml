name: Publish & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Type of semantic version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Bump package version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_name }}" != "development" ]; then
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
            SUFFIX=$(echo "${{ github.ref_name }}" | tr '/' '-')
            npm version "${VERSION}-${SUFFIX}" --allow-same-version
          else
            npm version ${{ github.event.inputs.version }}
          fi
          git push
          git push --tags

      - name: Set release tag
        run: echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build package
        run: npm run build

      - name: Publish to npm
        id: publish
        uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          tag: ${{ github.ref_name == 'development' && 'latest' || github.ref_name }}

      - name: Create GitHub Release
        if: steps.publish.outcome == 'success'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
