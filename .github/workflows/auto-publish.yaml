name: Auto Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version to release (e.g., 1.3.0)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # allows commits, tags, and releases

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
#          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Determine release version
      - name: Determine release version
        id: version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual trigger: use provided version
            NEW_VERSION=${{ github.event.inputs.version }}
            npm version $NEW_VERSION --no-git-tag-version -m "chore(release): bump version to %s"
          else
            # Auto patch bump if no input provided
            NEW_VERSION=$(npm version patch -m "chore(release): bump version to %s")
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          git push origin development --follow-tags

      # 5️⃣ Generate release notes dynamically from merged PRs
      - name: Generate release notes
        id: release_notes
        run: |
          # Get repo from package.json
          REPO_URL=$(node -p "require('./package.json').repository.url")
          REPO_URL=${REPO_URL#git@github.com:}
          REPO_URL=${REPO_URL#https://github.com/}
          REPO_URL=${REPO_URL%.git}

          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^)

          # Count merged PRs since last tag
          PR_COUNT=$(gh pr list --repo $REPO_URL --state merged --base development --search "merged:>$LAST_TAG" --json number | jq '. | length')

          if [ "$PR_COUNT" -le 1 ]; then
            NOTES="#### Dashboard\n"
            NOTES+=$(git log $LAST_TAG..HEAD --merges --pretty=format:"- [%h] %s (#%d)" | sed 's/.*(#\([0-9]*\)).*/- [FIX] \1/')
            NOTES+="\n\n**Full Changelog**: https://github.com/$REPO_URL/compare/$LAST_TAG...${{ env.NEW_VERSION }}"
          else
            NOTES="## What's Changed\n"
            NOTES+=$(gh pr list --repo $REPO_URL --state merged --base development --search "merged:>$LAST_TAG" --json number,title,author,url | \
              jq -r '.[] | "* [" + .title + "] by @" + .author.login + " in " + .url')
            NOTES+="\n\n**Full Changelog**: https://github.com/$REPO_URL/compare/$LAST_TAG...${{ env.NEW_VERSION }}"
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 6️⃣ Create GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_VERSION }}
          release_name: ${{ env.NEW_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7️⃣ Build the package
      - name: Build package
        run: npm run build

