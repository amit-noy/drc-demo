name: Auto Publish to npm

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version to release (e.g., 1.3.0)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
#          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # 1️⃣ Determine release version
      - name: Determine release version
        id: version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual trigger: use provided version
            NEW_VERSION=${{ github.event.inputs.version }}
            npm version $NEW_VERSION --no-git-tag-version -m "chore(release): bump version to %s"
          else
            # Automated trigger: bump patch version
            NEW_VERSION=$(npm version patch -m "chore(release): bump version to %s")
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          git push origin development --follow-tags

      # 2️⃣ Generate release notes from merged PRs
      - name: Generate release notes from merged PRs
        id: release_notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^)
          NOTES=$(git log $LAST_TAG..HEAD --merges --pretty=format:"- %s" | sed 's/Merge pull request #/PR #/')
          NOTES="### Merged PRs for this release\n$NOTES"
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 3️⃣ Create GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_VERSION }}
          release_name: ${{ env.NEW_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ Build the package
      - name: Build package
        run: npm run build

#      # 5️⃣ Publish to npm
#      - name: Publish to npm
#        run: npm publish --access public
#        env:
#          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
