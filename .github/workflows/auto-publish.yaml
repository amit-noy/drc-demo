name: Auto Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version to release (e.g., 1.3.0)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # allows commits, tags, and releases

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
#          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Determine release version
      - name: Determine release version
        id: version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION=${{ github.event.inputs.version }}
            npm version $NEW_VERSION --no-git-tag-version -m "chore(release): bump version to %s"
          else
            NEW_VERSION=$(npm version patch -m "chore(release): bump version to %s")
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          git push origin development --follow-tags

      # 5️⃣ Generate release notes (squash-and-merge aware)
      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get repo URL from package.json
          REPO_URL=$(node -p "require('./package.json').repository.url")
          
          # Normalize to GitHub HTTPS
          if [[ "$REPO_URL" == git://* ]]; then
            REPO_URL=${REPO_URL#git://}       # remove git://
            REPO_URL=${REPO_URL%.git}         # remove .git suffix
            REPO_URL="https://$REPO_URL"
          else
            REPO_URL=${REPO_URL#git@github.com:}
            REPO_URL=${REPO_URL#https://github.com/}
            REPO_URL=${REPO_URL%.git}
            REPO_URL="https://github.com/$REPO_URL"
          fi
          
          # Last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^)
          
          # Fetch merged PRs since last tag using gh
          PRS=$(gh pr list --repo $REPO_URL --state merged --base development --json number,title,author,url --limit 100)
          
          # Build release notes
          if [ $(echo "$PRS" | jq 'length') -eq 0 ]; then
            NOTES="## What's Changed\n* No merged PRs since last release"
          else
            NOTES="## What's Changed"
            for row in $(echo "$PRS" | jq -r '.[] | @base64'); do
              _jq() {
                echo "$row" | base64 --decode | jq -r "$1"
              }
              TITLE=$(_jq '.title')
              NUMBER=$(_jq '.number')
              USER=$(_jq '.author.login')
              URL=$(_jq '.url')
              NOTES+="\n* $TITLE by @$USER in $URL"
            done
          fi
          
          NOTES+="\n\n**Full Changelog**: $REPO_URL/compare/$LAST_TAG...${{ env.NEW_VERSION }}"
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 6️⃣ Create GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_VERSION }}
          release_name: ${{ env.NEW_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7️⃣ Build the package
      - name: Build package
        run: npm run build

